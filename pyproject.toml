[project]
name = "signalpost-agent"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
  "beautifulsoup4>=4.14,<5",
  "extruct>=0.18,<1",
  "lxml>=6,<7",
  "pydantic>=2.12,<3",
  "tldextract>=5.3,<6",
  "trafilatura>=2.0,<3",
]

[project.scripts]
signalpost = "signalpost.cli:main"

[build-system]
requires = ["hatchling>=1.25,<2"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/signalpost"]

[tool.uv]
package = true
